<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Coin Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 flex justify-center">

    <!DOCTYPE html>
    <html>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.tailwindcss.com"></script>
        <style>
            .app {
                width: 100%;
                max-width: 400px;
            }

            .glass {
                background: rgba(255, 255, 255, 0.25);
                backdrop-filter: blur(8px);
            }

            .coin {
                margin-bottom: 10px;
            }

            .templet {
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
                width: 100%;
                margin-top: 20px;
            }

            .templet img {
                width: 90%;
                border-radius: 15px 15px 0px 0px;
                overflow: hidden;

            }

            .spin {
                width: 30px;
            }

            .buy-coins-bar {
                display: flex;
                box-shadow: #111 1px 1px 15px;
                border-radius: 0px 0px 15px 15px;
                width: 90%;
                justify-content: space-between;
                align-items: center;
                padding: 5px;
            }

            .buy-left {
                display: flex;

            }

            .buy-left img {
                width: 32px;
            }

            .buy-title {
                font-size: 15px;
                font-weight: 700;
            }

            .buy-sub {
                font-size: 12px;
                color: #f59e0b;
                font-weight: 600;
            }

            .buy-time {
                font-size: 13px;
                font-weight: 700;
                color: #111;
                white-space: nowrap;
            }

            #logoutBtn {
                background-color: white;
                padding: 5px;
                border-radius: 5px;
                margin-top: 30px;
            }
        </style>
    </head>

    <body class="bg-gray-100 flex justify-center">
        <div class="w-full max-w-md bg-white min-h-screen app">

            <div class="bg-[#FFD13B] p-6 rounded-b-[40px] text-center shadow-lg">
                <div class="flex justify-center">
                    <img id="userImg" src="" class="w-20 h-20 rounded-full border-4 border-white shadow-md">
                </div>
                <h2 id="realName" class="text-white text-2xl font-bold mt-2">Loading...</h2>
                <p class="text-white/70 text-sm" id="userHandle">Loading...</p>

                <div class="flex justify-between mt-6 gap-2">
                    <div class="glass flex-1 p-3 rounded-2xl text-white">
                        <p id="followerCount" class="font-bold">0</p>
                        <p class="text-[10px] opacity-80 uppercase">Follower</p>
                    </div>
                    <div class="glass flex-1 p-3 rounded-2xl text-white">
                        <p id="followingCount" class="font-bold">0</p>
                        <p class="text-[10px] opacity-80 uppercase">Following</p>
                    </div>
                    <div class="glass flex-1 p-3 rounded-2xl text-white">
                        <p id="postCount" class="font-bold">0</p>
                        <p class="text-[10px] opacity-80 uppercase">Posts</p>
                    </div>
                </div>

                <button id="logoutBtn" onclick="logout()">Logout</button>
            </div>
            <div class="templet">
                <img src="img/temp.jpeg" alt="">
                <div class="buy-coins-bar">
                    <div class="buy-left">
                        <img src="https://cdn.sharechat.com/1158c4d7_1646376498635_sc.webp" alt="coin-icon"
                            loading="lazy">
                        <div class="buy-text" bis_skin_checked="1">
                            <div class="buy-title" bis_skin_checked="1">Buy Coins</div>
                            <div class="buy-sub" bis_skin_checked="1">Flash Sale is on</div>
                        </div>
                    </div>

                    <!-- Time -->
                    <div class="buy-time" id="countdown" bis_skin_checked="1">12h : 27m</div>
                </div>
            </div>
            <div class="coinbox" style="padding: 20px;" id="coinContainer">
                <h3 class="font-bold mb-4">Select Coin Pack</h3>

            </div>
            <div id="paymentModal"
                class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
                <div class="bg-white rounded-2xl w-full max-w-sm p-6 text-center">
                    <h2 class="text-xl font-bold mb-2">Total: ₹<span id="payAmount">0</span></h2>
                    <p id="packDetail" class="text-sm text-gray-500 mb-4"></p>

                    <div class="bg-gray-100 p-4 rounded-lg mb-4">
                        <p class="text-xs text-gray-400 uppercase">Scan to Pay</p>
                        <div class="w-32 h-32 bg-gray-300 mx-auto my-2 flex items-center justify-center"><img src=""
                                id="qrImage"></div>
                        <p class="text-sm font-mono select-all" id="upiId">krishna-254@ptyes</p>
                    </div>

                    <form id="paymentForm">
                        <input type="text" id="utr" placeholder="Enter Transaction ID / UTR"
                            class="w-full border p-3 rounded-lg mb-3" required>

                    </form>
                    <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold"
                        id="paynowbtn">Pay
                        Now</button>
                    <button onclick="closeModal()" class="mt-2 text-gray-400 text-sm">Cancel</button>
                </div>
            </div>
        </div>

        <script>

            window.onload = () => {
                const saved = localStorage.getItem('userProfile');
                if (!saved) return window.location.href = "index.html";

                const data = JSON.parse(saved);

                // Data mapping to your premium UI
                document.getElementById('realName').innerText = data.name;
                document.getElementById('userHandle').innerText = '@' + data.username;
                document.getElementById('userImg').src = data.image;
                document.getElementById('followerCount').innerText = data.followers;
                document.getElementById('followingCount').innerText = data.following;
                document.getElementById('postCount').innerText = data.posts;
            };

            function openPayment(amt, details) {
                document.getElementById('payAmount').innerText = amt;
                document.getElementById('packDetail').innerText = details;
                document.getElementById('paymentModal').classList.remove('hidden');

                const upiRaw = `upi://pay?pa=krishna-254@ptyes&pn=CoinsShop&am=${amt}&cu=INR&tn=BuyCoins`;
                const upi = encodeURIComponent(upiRaw);

                const qrImg = document.getElementById("qrImage");
                qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${upi}`;
            }


            function closeModal() {
                document.getElementById('paymentModal').classList.add('hidden');
            }

            function logout() {
                const logoutbtn = document.getElementById("logoutBtn");
                localStorage.clear();
                window.location.href = "index.html"
            }

        </script>
        <script src="coin.js"></script>
    </body>

    </html>
