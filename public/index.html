            cursor: pointer;

        #disclaimer {

            bottom: 0;

        <div class="login">
            <div>
                <h2>Login</h2>
                <input type="text" placeholder="Enter Number" id="phoneInput">
                <input type="text" placeholder="Enter Username" id="userInput">
                <button onclick="processLogin()" id="btnText">submit</button>
            </div>

        <p id="disclaimer">Your Privacy is important to us and your number will be safe. By continuing, you agree to
            ShareChat <span>Terms and Conditions, Privacy Policy and Content & Community Guidelines.</span></p>
    </div>

    <script>
        const loader = document.getElementById("loader");

        window.onload = function () {
            loader.style.display = "none";
            const saved = localStorage.getItem('userProfile');
            if (saved) return window.location.href = "profile.html";
        }

        async function processLogin() {
            const user = document.getElementById('userInput').value;
            const phone = document.getElementById('phoneInput').value;
            if (!user || !phone) return alert("Enter All Details");

            const res = await fetch('/api/profile-data', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: user })
            });
            const data = await res.json();

            if (!data.error) {
                // Phone number ko data mein add karke save karna
                data.phone = phone;
                localStorage.setItem('userProfile', JSON.stringify(data));
                window.location.href = "profile.html";
            } else {
                alert("Invalid Username!");
            }
        }

    </script>
