<!DOCTYPE html>
<html>
<head>
<title>Coin Admin</title>
</head>
<body>

<h2>Add Coin Pack</h2>

<input id="coins" placeholder="coins">
<input id="bonus" placeholder="bonus">
<input id="price" placeholder="price">
<input id="oldPrice" placeholder="oldPrice">

<button onclick="add()">Add</button>

<h2>Coin List</h2>

<div id="list"></div>

<script>

async function load(){

let res = await fetch("/coins");
let data = await res.json();

let html="";

data.forEach((item,i)=>{

html+=`
<div>
${item.coins} + ${item.bonus} Bonus
₹${item.price}
<button onclick="del(${i})">Delete</button>
</div>
`;

});

document.getElementById("list").innerHTML=html;

}

async function add(){

let data={
coins:coins.value,
bonus:bonus.value,
price:price.value,
oldPrice:oldPrice.value
};

await fetch("/add",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify(data)
});

load();

}

async function del(i){

await fetch("/delete",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({index:i})
});

load();

}

load();

</script>

</body>
</html>
